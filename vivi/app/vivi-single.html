<title>VIVI</title>
<meta name="description" content="VIVI, la tua città prende vita">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>/* VIVI Design System — token, componenti, animazioni. Niente gradienti CSS, niente emoji. */
:root{
  --viola:#6845F5;--lilla:#A98BFF;--lav:#DCD2FF;--crema:#FFF8F0;--prugna:#251C35;--rosa:#FFB7D5;--lime:#D9EF70;
  --white:#fff;--g100:#F5F5F5;--g200:#E8E8EC;--g300:#D1D1D6;--g500:#8E8E93;--nero:#1C1C1E;--warn:#F5A623;
  --bg:#FFF8F0;--card-bg:#fff;--fg:#251C35;--fg2:#8E8E93;--card-shadow:rgba(37,28,53,.08);
  --tab-bg:rgba(255,255,255,.85);--input-bg:#fff;--input-border:#D1D1D6;
  --soft:#DCD2FF;--soft-fg:#6845F5;--sunk:#F5F5F5;--line:#E8E8EC;--stage:#E7E1F2;--ink:#251C35;
  --ease:cubic-bezier(.4,0,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1225;--card-bg:#2A2035;--fg:#F0ECF5;--fg2:#A59FB0;--card-shadow:rgba(0,0,0,.25);--tab-bg:rgba(42,32,53,.85);
  --input-bg:#2A2035;--input-border:#4A4055;--soft:#3B2F5A;--soft-fg:#B9A4FF;--sunk:#2F2540;--line:#3A3048;--stage:#0E0916;--g200:#3A3048;--g300:#4A4055;}}
:root[data-theme="dark"]{
  --bg:#1A1225;--card-bg:#2A2035;--fg:#F0ECF5;--fg2:#A59FB0;--card-shadow:rgba(0,0,0,.25);--tab-bg:rgba(42,32,53,.85);
  --input-bg:#2A2035;--input-border:#4A4055;--soft:#3B2F5A;--soft-fg:#B9A4FF;--sunk:#2F2540;--line:#3A3048;--stage:#0E0916;--g200:#3A3048;--g300:#4A4055;}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Sora',system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0;font-size:15px;line-height:1.4}
@media (min-width:441px){body{background:var(--stage)}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg{display:block;flex-shrink:0}
i[data-i],span[data-m]{display:inline-flex;flex-shrink:0}
h1,h2,h3,.sora{font-family:'Sora',sans-serif}

/* ---- Frame telefono ---- */
.phone{position:relative;width:393px;height:852px;border-radius:40px;overflow:hidden;background:var(--bg);box-shadow:0 0 0 9px var(--prugna),0 40px 90px rgba(37,28,53,.4);isolation:isolate;flex-shrink:0}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:100px;scrollbar-width:none;animation:slideIn .35s var(--ease) both}
.screen::-webkit-scrollbar{display:none}
.screen.nopad{padding-bottom:0}
.screen.leaving{transition:transform .3s var(--ease),opacity .3s;transform:translateX(-30%);opacity:0;animation:none}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:440px){body{padding:0}.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}

/* ---- Tipografia ---- */
.t-xl{font:800 26px/1.15 'Sora'}.t-lg{font:700 22px/1.2 'Sora'}.t-md{font:700 18px/1.25 'Sora'}.t-sm{font:600 16px/1.3 'Sora'}
.sec{font:600 16px/1.3 'Sora';display:flex;align-items:center;gap:8px}
.sec.big{font-size:18px;font-weight:700}
.muted{color:var(--fg2)}.sm{font-size:13px}.xs{font-size:12px}
.violet{color:var(--soft-fg)}

/* ---- Layout ---- */
.pad{padding:0 20px}.col{display:flex;flex-direction:column}.row{display:flex;align-items:center}
.gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.between{justify-content:space-between}.center{justify-content:center;text-align:center}.grow{flex:1;min-width:0}
.section{padding:0 20px;margin-top:22px}
.section>.sec{margin-bottom:12px}
.topbar{display:flex;align-items:center;gap:10px;padding:52px 20px 12px}
.topbar h1{font:700 20px 'Sora';flex:1}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;transition:background .2s,transform .15s}
.iconbtn:hover{background:var(--sunk)}.iconbtn:active{transform:scale(.92)}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 20px}
.hscroll::-webkit-scrollbar{display:none}

/* ---- Componenti ---- */
.card{background:var(--card-bg);border-radius:20px;box-shadow:0 2px 12px var(--card-shadow);transition:transform .2s,box-shadow .2s}
a.card:hover,.card.hov:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(37,28,53,.14)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--viola);color:#fff;border-radius:999px;padding:12px 28px;font:600 15px 'Sora';transition:all .2s var(--ease);white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(104,69,245,.35)}
.btn:active{transform:scale(.97);box-shadow:0 2px 6px rgba(104,69,245,.25)}
.btn.sec{background:var(--soft);color:var(--soft-fg)}
.btn.sec:hover{box-shadow:0 6px 16px var(--card-shadow)}
.btn.block{width:100%}.btn.tall{height:52px}.btn.sm{padding:8px 16px;font-size:13px}
.btn.line{background:transparent;color:var(--soft-fg);box-shadow:inset 0 0 0 1.5px var(--viola)}
.btn[disabled],.btn.off{opacity:.5;cursor:not-allowed;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 14px;font:500 13px 'Sora';white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s,transform .15s}
.pill.s{padding:4px 10px;font-size:11px;font-weight:700}
.pill.lav{background:var(--soft);color:var(--soft-fg)}.pill.lime{background:var(--lime);color:var(--ink)}.pill.rosa{background:var(--rosa);color:var(--ink)}
.pill.viola{background:var(--viola);color:#fff}.pill.white{background:var(--card-bg);color:var(--fg)}.pill.warn{background:var(--warn);color:var(--ink)}
.pill.prugna{background:var(--prugna);color:#fff}
.chip{cursor:pointer;background:var(--card-bg);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--g300)}
.chip.on{background:var(--viola);color:#fff;box-shadow:none}
.chip:active{transform:scale(.95)}
.input{position:relative;display:flex;align-items:center;gap:10px;background:var(--input-bg);border:1.5px solid var(--input-border);border-radius:16px;height:50px;padding:0 16px;transition:border-color .2s,box-shadow .2s,transform .2s;color:var(--fg2)}
.input:focus-within{border-color:var(--viola);box-shadow:0 0 0 3px rgba(104,69,245,.12);color:var(--viola)}
.input input{flex:1;min-width:0;border:0;outline:0;background:none;font:400 15px 'Sora';color:var(--fg)}
.input input::placeholder{color:var(--fg2)}
.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 16px 'Sora';color:var(--ink);flex-shrink:0}
.ava.s{width:28px;height:28px;font-size:12px}.ava.m{width:36px;height:36px;font-size:14px}.ava.l{width:48px;height:48px}.ava.xl{width:44px;height:44px}
.c-rosa{background:var(--rosa)}.c-lime{background:var(--lime)}.c-lav{background:var(--lav)}.c-lilla{background:var(--lilla)}.c-viola{background:var(--viola);color:#fff}.c-prugna{background:var(--prugna);color:#fff}
.stack{display:flex}.stack>*{border:2px solid var(--card-bg);margin-left:-8px}.stack>*:first-child{margin-left:0}
.meta{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--fg2)}
.bar{height:6px;border-radius:4px;background:var(--g200);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:inherit;background:var(--viola);transition:width 1s ease}
.dock{position:absolute;left:0;right:0;bottom:100px;padding:12px 20px;z-index:20;display:flex;gap:12px}
.dock.solid{background:var(--card-bg);box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.fab{position:absolute;left:50%;transform:translateX(-50%);bottom:104px;z-index:20;animation:fab 2.4s ease-in-out infinite}
@keyframes fab{0%,100%{margin-bottom:0}50%{margin-bottom:4px}}
.sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--g300);margin:10px auto}
.divider{height:1px;background:var(--line)}
.hide{display:none!important}

/* ---- Bubble mascotte ---- */
.bubble{display:inline-block;background:var(--lime);color:var(--ink);border-radius:14px 14px 14px 4px;padding:9px 14px;font:500 14px 'Sora';transform-origin:left bottom;animation:pop .5s cubic-bezier(.34,1.56,.64,1) both;animation-delay:var(--d,.4s)}
.bubble.white{background:var(--card-bg);color:var(--fg);box-shadow:0 4px 14px var(--card-shadow)}
.bubble.rosa{background:var(--rosa)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.float{animation:floaty 3s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.m-wave{transform-origin:81px 88px;animation:wave 1.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}

/* ---- Animazioni entrata ---- */
.rv{opacity:0;transform:translateY(20px);transition:opacity .5s var(--ease),transform .5s var(--ease);transition-delay:var(--rd,0ms)}
.rv.in{opacity:1;transform:none}
.like.on svg{animation:likeb .4s ease both;color:#FF5C8A;fill:#FF5C8A}
@keyframes likeb{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.sk{position:relative;overflow:hidden;background:var(--g200);border-radius:12px}
.sk::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.35);transform:translateX(-100%);animation:shimmer 1.4s infinite;filter:blur(8px);width:60%}
@keyframes shimmer{to{transform:translateX(260%)}}
.pulse-dot{animation:pdot 1.6s ease-out infinite}
@keyframes pdot{0%{box-shadow:0 0 0 0 rgba(104,69,245,.4)}100%{box-shadow:0 0 0 10px rgba(104,69,245,0)}}

/* ---- Tab bar fluttuante ---- */
.tabbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:calc(100% - 40px);max-width:353px;display:flex;padding:8px 6px;border-radius:28px;background:var(--tab-bg);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 8px 32px rgba(37,28,53,.12),0 2px 8px rgba(37,28,53,.08);z-index:50}
.tabbar .glow{position:absolute;top:8px;left:6px;width:44px;height:44px;border-radius:50%;background:var(--soft);transition:transform .3s ease;pointer-events:none}
.tabbar .tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--fg2);font:500 10px 'Sora';transition:color .2s ease}
.tabbar .tab .ic{width:44px;height:44px;display:grid;place-items:center;transition:transform .2s}
.tabbar .tab.on{color:var(--viola)}
:root[data-theme="dark"] .tabbar .tab.on{color:#B9A4FF}
.tabbar .tab.on .ic{transform:scale(1.05)}
.tabbar .tab.on::after{content:"";position:absolute;top:35px;width:4px;height:4px;border-radius:50%;background:currentColor}
.tabbar .tab:active .ic{transform:scale(.92)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  .rv{opacity:1;transform:none}
}

/* VIVI app — stili app (estende ../vivi.css) */
body{overflow:hidden}
#stage{position:absolute;inset:0;overflow:hidden}
.view{animation:none;padding-bottom:110px}
.view.nopad{padding-bottom:0}
.view.vi-r{animation:viR .38s var(--ease) both}.view.vi-l{animation:viL .38s var(--ease) both}.view.vi-fade{animation:viF .5s ease both}
.view.vi-tr{animation:viTR .32s var(--ease) both}.view.vi-tl{animation:viTL .32s var(--ease) both}
.view.vo-l{animation:voL .38s var(--ease) both}.view.vo-r{animation:voR .38s var(--ease) both}.view.vo-fade{animation:voF .3s ease both}
@keyframes viR{from{transform:translateX(100%)}to{transform:none}}@keyframes viL{from{transform:translateX(-30%);opacity:.5}to{transform:none;opacity:1}}
@keyframes viF{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
@keyframes viTR{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}@keyframes viTL{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes voL{to{transform:translateX(-30%);opacity:.4}}@keyframes voR{to{transform:translateX(100%)}}@keyframes voF{to{opacity:0}}
#layer{position:absolute;inset:0;pointer-events:none;z-index:100;overflow:hidden}
#layer>*{pointer-events:auto}#layer>.bp,#layer>.xpfloat,#layer>.toast{pointer-events:none}
.bp{position:absolute;display:block;z-index:200}
.ov{position:absolute;inset:0;background:rgba(37,28,53,.45);opacity:0;transition:opacity .3s;z-index:110}.ov.on{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card-bg);border-radius:24px 24px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.15);z-index:111;transform:translateY(100%);transition:transform .35s var(--ease);padding:0 24px 28px;max-height:86%;overflow-y:auto;scrollbar-width:none}
.sheet.on{transform:none}.sheet.tall{min-height:50%}
.modal-ov{display:grid;place-items:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal{width:330px;background:var(--card-bg);border-radius:28px;padding:28px 24px;box-shadow:0 20px 60px rgba(37,28,53,.25);transform:scale(.9);opacity:0;transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .25s}
.modal-ov.on .modal{transform:none;opacity:1}.modal-ov.closing .modal{transform:scale(.95);opacity:0}
.toast{position:absolute;left:50%;top:54px;transform:translateX(-50%);background:var(--prugna);color:#fff;border-radius:999px;padding:10px 18px 10px 10px;display:flex;align-items:center;gap:10px;font:500 14px 'Sora';z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:toastIn .45s cubic-bezier(.34,1.56,.64,1) both;white-space:nowrap}
.toast.out{animation:toastOut .3s ease both}.toast .ti{width:26px;height:26px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center}
@keyframes toastIn{from{transform:translate(-50%,-30px) scale(.8);opacity:0}to{transform:translate(-50%,0);opacity:1}}@keyframes toastOut{to{transform:translate(-50%,-20px);opacity:0}}
.xpfloat{position:absolute;left:50%;top:50%;transform:translateX(-50%);background:var(--lime);color:var(--ink);padding:10px 18px;border-radius:999px;display:flex;align-items:center;gap:8px;font:700 16px 'Sora';z-index:300;box-shadow:0 10px 30px rgba(104,69,245,.35);animation:xpUp 2.3s ease both}
.xpfloat span{font:500 12px 'Sora';opacity:.7}
@keyframes xpUp{0%{transform:translate(-50%,40px) scale(.6);opacity:0}15%{transform:translate(-50%,0) scale(1.08);opacity:1}25%{transform:translate(-50%,0) scale(1)}80%{transform:translate(-50%,-30px);opacity:1}100%{transform:translate(-50%,-60px);opacity:0}}
.btn{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
.btn.sec .ripple,.chip .ripple{background:rgba(104,69,245,.2)}
@keyframes rip{to{transform:scale(1);opacity:0}}
[data-to],[data-act]{cursor:pointer}
.card[data-to]:active{transform:scale(.98)}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabbar{transition:transform .35s var(--ease),opacity .3s}.tabbar.hide{transform:translate(-50%,160%);opacity:0;pointer-events:none}
.tabbar .tab{background:none;border:0}.tabbar .tab.on svg{fill:currentColor;fill-opacity:.18}
.lvring{animation:floaty 2s ease-in-out infinite}
.bdg-pop{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;animation:bpop .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes bpop{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
.pk{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:16px;background:var(--sunk);margin-bottom:8px;transition:transform .15s}.pk:active{transform:scale(.98)}
.pk .ci{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--soft-fg);display:grid;place-items:center}
.nrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.nrow.unr{font-weight:600}
.nrow .ni{width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--soft-fg);display:grid;place-items:center;flex-shrink:0}
.pop svg{animation:likeb .4s ease}
[data-act="save"].on,[data-act="like"].on{color:#FF5C8A}
.hide{display:none!important}
/* hero home */
.hero{position:relative;height:440px;background:var(--prugna);overflow:hidden;color:#fff}
.hero .amb{position:absolute;left:50%;top:50%;transform:translate(-50%,-60%);overflow:visible;transition:opacity .6s}
.hero .shade{position:absolute;left:-30px;right:-30px;bottom:-60px;height:260px;background:var(--prugna);filter:blur(26px);opacity:.92}
.hero .top{position:absolute;top:50px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.hello{font:700 20px 'Sora';display:flex;align-items:center;gap:8px}
.bellb{position:relative;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff}
.bellb b{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--rosa);animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,183,213,.6)}100%{box-shadow:0 0 0 8px rgba(255,183,213,0)}}
.playb{position:absolute;left:50%;top:44%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff;transition:transform .2s,background .2s;animation:bpulse 2.4s ease-in-out infinite;z-index:2}
.playb:hover{transform:scale(1.08)}.playb svg{margin-left:2px}.playb.on svg{margin:0}
@keyframes bpulse{50%{border-color:rgba(255,255,255,.15)}}
.eq{position:absolute;left:50%;top:44%;margin-top:60px;transform:translateX(-50%);display:none;gap:4px;align-items:flex-end;height:30px;z-index:2}.hero.playing .eq{display:flex}
.eq i{width:5px;border-radius:3px;background:var(--lime);animation:eq .9s ease-in-out infinite}.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}.eq i:nth-child(5){animation-delay:.6s}
@keyframes eq{0%,100%{height:6px}50%{height:28px}}
.vprog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.15);z-index:4}.vprog i{display:block;height:100%;width:0;background:var(--lime)}
.hero.playing .vprog i{animation:vp 8s linear forwards}@keyframes vp{to{width:100%}}
.side{position:absolute;right:16px;top:150px;display:flex;flex-direction:column;gap:20px;align-items:center;z-index:3}
.side button{display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;font:700 11px 'Sora';filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.side button.on{color:#FF5C8A}.side button.on svg{fill:#FF5C8A}
.hinfo{position:absolute;left:24px;right:70px;bottom:44px;z-index:3;display:flex;flex-direction:column;gap:8px;align-items:flex-start;transition:opacity .3s,transform .3s}
.hinfo.sw{opacity:0;transform:translateY(10px)}
.cr{display:flex;align-items:center;gap:8px;font:700 14px 'Sora'}.cr .av{width:30px;height:30px;border-radius:50%;background:var(--lilla);display:grid;place-items:center;overflow:hidden}
.vm{display:flex;gap:12px;font-size:13px;opacity:.85;flex-wrap:wrap}.vm span{display:inline-flex;align-items:center;gap:4px}
.vdots{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:3}
.vdots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.35);transition:width .3s,background .3s}.vdots i.on{width:24px;background:#fff}
.pn{display:flex;gap:12px;padding:24px}
.pn a{flex:1;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:4px;box-shadow:0 2px 12px var(--card-shadow);transition:transform .25s,box-shadow .25s}
.pn a:hover{transform:translateY(-3px)}.pn a:active{transform:scale(.97)}.pn small{font-size:13px;opacity:.7}
.ev{display:flex;overflow:hidden;border-radius:20px;min-height:105px}
.ev .th{width:105px;position:relative;flex-shrink:0;display:grid;place-items:center;color:var(--ink)}
.ev .th .tc{opacity:.5}.ev .th .like{position:absolute;top:8px;right:8px;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.3))}

.art>svg,.art>span{position:relative;z-index:1}
.ob-s h2{font:800 26px 'Sora';text-align:center;margin-top:8px}.ob-s p{color:var(--fg2);font-size:16px;text-align:center;max-width:300px;margin-top:12px}
.obfoot{position:absolute;left:0;right:0;bottom:46px;padding:0 24px;display:flex;flex-direction:column;align-items:center;gap:16px;z-index:5}
.dots{display:flex;gap:6px}.dots i{width:6px;height:6px;border-radius:3px;background:var(--g300);transition:width .3s,background .3s}.dots i.on{width:24px;background:var(--viola)}
.reduced-note{display:none}
@media (prefers-reduced-motion:reduce){.view{animation:none!important}.tabbar,.sheet,.modal{transition-duration:.01ms!important}}
.btn[data-act="save"].on{color:var(--soft-fg)}
.shake{display:inline-block;animation:shk 1.2s ease-in-out infinite}
.view.pbd{padding-bottom:200px}

/* ===== Regole dal video: griglia 24px, colori morbidi, icone leggibili su immagini, divisori sottili ===== */
:root{--gx:24px;--line:rgba(37,28,53,.07);--fg-body:#4B4259}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--line:rgba(255,255,255,.08);--fg-body:#CFC8DA}}
:root[data-theme="dark"]{--line:rgba(255,255,255,.08);--fg-body:#CFC8DA}
body{line-height:1.45}
.pad{padding-left:var(--gx);padding-right:var(--gx)}.section{padding:0 var(--gx)}.topbar{padding:52px var(--gx) 12px}.hscroll{padding:2px var(--gx)}.dock{padding:12px var(--gx)}.pn{padding:20px var(--gx)}
.hscroll.flush{padding-left:0;padding-right:0}
/* icone sopra immagini: contenitore scuro semitrasparente + contorno sottile */
.ovl,.ev .th .like,.ev .th .pl,.vid .pl,.side .ib{display:grid;place-items:center;border-radius:50%;background:rgba(37,28,53,.42);border:1px solid rgba(255,255,255,.55);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);filter:none}
.ev .th .like{width:32px;height:32px;top:8px;right:8px}.ev .th .pl{width:28px;height:28px;bottom:8px;left:8px;color:#fff}
.vid .pl{border-color:rgba(255,255,255,.55)}
.side button{filter:none}.side .ib{width:44px;height:44px}.side button.on .ib{color:#FF8FB1}.side button.on svg{fill:#FF8FB1}
.fl2{border:1px solid rgba(37,28,53,.14);box-shadow:0 1px 6px rgba(37,28,53,.18)}.bdg,.bellb{border:1px solid rgba(255,255,255,.45)}.bdg{border-color:rgba(37,28,53,.12)}
.ev .th .tc{opacity:.45}
/* tipografia: una famiglia, gerarchia con peso/colore/interlinea */
.desc,.dd{color:var(--fg-body);line-height:1.7;font-size:15px}
.pill.s{letter-spacing:.03em}.xs.cap{text-transform:uppercase;letter-spacing:.08em;font-weight:600}
/* fiducia: valutazione accanto al titolo */
.rt{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600}.rt svg{fill:#F5A623;stroke:#F5A623}.rt span{color:var(--fg2);font-weight:400}
/* dock evento: selettore e azione vicini */
.dock.buy{flex-direction:column;gap:10px;align-items:stretch}
.dock.buy .qty{display:flex;align-items:center;gap:8px}.dock.buy .qty .chip{min-width:36px;justify-content:center}
.dock.buy .act{display:flex;gap:10px}.dock.buy .sq{width:48px;height:48px;border-radius:50%;flex-shrink:0;background:var(--soft);color:var(--soft-fg);display:grid;place-items:center;transition:transform .15s}.dock.buy .sq:active{transform:scale(.92)}.dock.buy .sq.on{color:#FF5C8A}
.dock.buy .btn.main{flex:1;height:48px}

function icon(name,size=24,color){

function iconFill(name,size=24,color){return icon(name,size,color).replace('fill="none"','fill="'+(color||'currentColor')+'"');}

/* ---------- Mascotte VIVI ---------- */
function mascot(v='wave',size=100){
  const P='#251C35',V='#6845F5',L='#DCD2FF',T='#7FD8E6';
  const arm=(d,w)=>`<g${w||''}><path d="${d}" fill="none" stroke="${P}" stroke-width="11" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${V}" stroke-width="6.500" stroke-linecap="round"/></g>`;
  const hand=(x,y)=>`<circle cx="${x}" cy="${y}" r="4.800" fill="${L}" stroke="${P}" stroke-width="2"/>`;
  const head=v==='head';
  const happy=v==='party'||v==='happy'||v==='relax';
  const worried=v==='sad';
  const look=v==='search'?2.200:0;
  const eye=(cx)=> happy
    ? `<path d="M${cx-7} 52Q${cx} 43 ${cx+7} 52" fill="none" stroke="${P}" stroke-width="3" stroke-linecap="round"/>`
    : `<ellipse cx="${cx}" cy="50" rx="7.500" ry="9" fill="#fff" stroke="${P}" stroke-width="2"/><circle cx="${cx+look}" cy="51" r="5.300" fill="${T}"/><circle cx="${cx+look}" cy="51" r="3" fill="${P}"/><circle cx="${cx+look+2}" cy="48.500" r="1.800" fill="#fff"/><circle cx="${cx+look-1.500}" cy="53.500" r=".9" fill="#FFB7D5"/>`;
  const brows=worried?`<path d="M42 38l14 4M86 38l-14 4" stroke="${P}" stroke-width="2.800" stroke-linecap="round"/>`:v==='search'?`<path d="M72 38l12-3" stroke="${P}" stroke-width="2.800" stroke-linecap="round"/>`:'';
  const mouth=v==='party'?`<path d="M54 65Q64 80 74 65Q64 69 54 65z" fill="${P}" stroke="${P}" stroke-width="2" stroke-linejoin="round"/><path d="M59 72Q64 76 69 72Q64 70 59 72z" fill="#FF8DB5"/>`
    :worried?`<path d="M57 70Q64 64 71 70" fill="none" stroke="${P}" stroke-width="2.400" stroke-linecap="round"/>`
    :`<path d="M55 65Q61 71.500 67 66Q70 64 73 61.500" fill="none" stroke="${P}" stroke-width="2.400" stroke-linecap="round"/>`;
  const tail=`<g><path d="M82 120C42 136 6 108 12 72C17 42 56 34 64 58C69 74 50 86 40 74" fill="none" stroke="${P}" stroke-width="31" stroke-linecap="round"/><path d="M82 120C42 136 6 108 12 72C17 42 56 34 64 58C69 74 50 86 40 74" fill="none" stroke="${V}" stroke-width="24" stroke-linecap="round"/><path d="M82 120C42 136 6 108 12 72C17 42 56 34 64 58C69 74 50 86 40 74" fill="none" stroke="${L}" stroke-width="24" stroke-dasharray="9 17" opacity=".45"/><path d="M52 84C46 82 42 78 40 74" fill="none" stroke="${L}" stroke-width="22" stroke-linecap="round"/><path d="M12 74C14 52 34 40 58 44" fill="none" stroke="#5535D0" stroke-width="5" stroke-linecap="round" opacity=".55"/></g>`;
  const body=`<path d="M44 118C42 92 52 80 64 80S86 92 84 118z" fill="${V}" stroke="${P}" stroke-width="2.500" stroke-linejoin="round"/><ellipse cx="64" cy="102" rx="10" ry="15" fill="${L}"/>`;
  const feet=`<ellipse cx="51" cy="122" rx="12" ry="6.500" fill="${V}" stroke="${P}" stroke-width="2.500"/><ellipse cx="77" cy="122" rx="12" ry="6.500" fill="${V}" stroke="${P}" stroke-width="2.500"/><ellipse cx="47" cy="123" rx="4" ry="2.400" fill="${L}"/><ellipse cx="73" cy="123" rx="4" ry="2.400" fill="${L}"/>`;
  const ears=`<path d="M36 40L33 9L59 27z" fill="${V}" stroke="${P}" stroke-width="2.500" stroke-linejoin="round"/><path d="M39 33L37 17L50 27z" fill="${L}"/><path d="M33 9L30 1L38 6z" fill="${P}" stroke="${P}" stroke-width="1.500" stroke-linejoin="round"/><path d="M92 40L95 9L69 27z" fill="${V}" stroke="${P}" stroke-width="2.500" stroke-linejoin="round"/><path d="M89 33L91 17L78 27z" fill="${L}"/><path d="M95 9L98 1L90 6z" fill="${P}" stroke="${P}" stroke-width="1.500" stroke-linejoin="round"/>`;
  const face=`<ellipse cx="64" cy="52" rx="31" ry="26" fill="${V}" stroke="${P}" stroke-width="2.500"/><path d="M64 28l4.500 8-4.500 6-4.500-6z" fill="${L}" opacity=".8"/><ellipse cx="64" cy="65" rx="17" ry="11" fill="${L}"/><ellipse cx="42" cy="62" rx="6" ry="4" fill="#FFB7D5" opacity=".6"/><ellipse cx="86" cy="62" rx="6" ry="4" fill="#FFB7D5" opacity=".6"/>${brows}${eye(51)}${eye(77)}<path d="M60.500 58.500h7l-3.500 4z" fill="${P}" stroke="${P}" stroke-width="1.500" stroke-linejoin="round"/>${mouth}`;
  let arms='',top='',extra='';
  if(v==='wave'){arms=arm('M47 88Q41 100 45 110')+hand(45,110)+`<g class="m-wave">${arm('M81 88Q101 84 99 60')}${hand(99,60)}</g>`;}
  else if(v==='search'){arms=arm('M47 88Q41 100 45 110')+hand(45,110);top=arm('M81 88Q103 72 84 40')+hand(84,38);}
  else if(v==='party'){arms=arm('M47 88Q24 76 27 50')+hand(27,49)+arm('M81 88Q104 76 101 50')+hand(101,49);extra=`<path d="M12 20l2 5 5 2-5 2-2 5-2-5-5-2 5-2zM112 14l1.500 3.500 3.500 1.500-3.500 1.500-1.500 3.500-1.500-3.500-3.500-1.500 3.500-1.500z" fill="#D9EF70" stroke="${P}" stroke-width="1.200" stroke-linejoin="round"/>`;}
  else {arms=arm('M47 88Q48 102 60 105')+hand(60,105)+arm('M81 88Q80 102 68 105')+hand(68,105);}
  if(worried) extra=`<path d="M100 36q5 7 0 10q-5-3 0-10z" fill="${T}" stroke="${P}" stroke-width="1.500"/>`;
  let inner;
  if(head) inner=ears+face;
  else {
    inner=tail+body+feet+arms+ears+face+top+extra;
    if(v==='relax') inner=tail+body+feet+arms+ears+face+`<path d="M24 124C44 138 88 138 106 120" fill="none" stroke="${P}" stroke-width="30" stroke-linecap="round"/><path d="M24 124C44 138 88 138 106 120" fill="none" stroke="${V}" stroke-width="23" stroke-linecap="round"/><path d="M24 124C44 138 88 138 106 120" fill="none" stroke="${L}" stroke-width="23" stroke-dasharray="8 16" opacity=".45"/>`;
    if(v==='party') inner=`<g transform="translate(0,-5)">${inner}</g>`;
  }
  const vb=head?'24 0 80 84':'-6 -4 132 148';

 <div class="tabs" id="tb"><button class="on">${I('clipboard',14)}In programma</button><button>${I('bookmark',14)}Salvati</button><button>${I('checkc',14)}Completati</button><span class="ind" id="ind"></span></div><div class="section col" style="gap:14px;margin-top:18px" id="pane"></div>`,
 mount:el=>{const pane=$('#pane',el);let t=0;
  const planCard=p=>{const [lbl,cls,ic]=planStatus(p);const xp=A.planXp(p);return `<a class="card plan rv" data-to="/plan/${p.id}"><span class="d">${I('calendar',14)}${A.planDate(p)}</span><h3>${p.title}</h3><div class="row gap6" style="flex-wrap:wrap">${p.cats.slice(0,3).map(c=>`<span class="pill s lav">${CATS[c][0]}</span>`).join('')}</div><div class="ft">${avs(p)}<b class="sora violet grow" style="font:700 14px 'Sora';text-align:right">+${p.status==='done'?p.earned:xp} XP</b></div><span class="pill s ${cls}" style="position:absolute;top:16px;right:16px">${I(ic,11)}${lbl}</span></a>`};
  const draw=()=>{let h='';if(t===0){const r=S.plans.filter(p=>p.status!=='done').sort((a,b)=>a.date.localeCompare(b.date));h=r.length?r.map(planCard).join(''):emptyPlans()}
   else if(t===1){const r=S.saved.map(A.ev).filter(Boolean);h=r.length?`<div class="sm muted">Attività che ti interessano</div>`+r.map(e=>`<div class="sv rv" data-to="/event/${e.id}"><span style="color:#FF5C8A">${I('heart',16).replace('fill="none"','fill="currentColor"')}</span><div class="grow col gap4"><b class="sora" style="font:600 14px 'Sora'">${e.t}</b><div class="row gap12" style="flex-wrap:wrap"><span class="meta">${I('pin',12)}${e.place}</span><span class="meta">${I('calendar',12)}${A.whenLabel(e)}</span></div></div><button class="btn line sm" style="padding:6px 10px;font-size:12px" data-act="addplan" data-id="${e.id}">${I('plus',12)}Piano</button></div>`).join(''):`<div class="empty fade-in"><span class="float">${M('search',110)}</span><h2 class="sora" style="font:700 20px 'Sora'">Niente di salvato</h2><p>Tocca il cuore su un'attività per ritrovarla qui.</p><button class="btn" data-to="/home">${I('search',18)}Esplora</button></div>`}
   else{const r=S.plans.filter(p=>p.status==='done');h=r.length?r.map(planCard).join(''):`<div class="empty fade-in"><span class="float">${M('relax',110)}</span><h2 class="sora" style="font:700 20px 'Sora'">Nessun piano completato</h2><p>Porta a termine tutte le tappe per sbloccare XP e badge.</p></div>`}
   pane.innerHTML=h;A.enhance(pane)};
  draw();$('#tb',el).onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=$$('#tb button',el).indexOf(b);t=i;$$('#tb button',el).forEach(x=>x.classList.toggle('on',x===b));$('#ind',el).style.transform=`translateX(${i*100}%)`;draw()}}}));

/* ---------- timeline ---------- */
const walkTxt=(a,b)=>{const m=Math.max(200,Math.round(Math.abs(a.km-b.km)*1000/100)*100);return m<1500?m+'m a piedi':Math.round(m/250)+' min in metro'};
const curIdx=p=>p.status==='active'?p.stops.findIndex(s=>!s.done):-1;
A.route('plan',([id])=>{const p=S.plans.find(x=>x.id===id);if(!p)return{tab:'plans',html:`<div class="topbar"><button class="iconbtn" data-to="back">${I('back',24)}</button></div><div class="empty"><span class="shake" style="color:#FF7FB0">${I('warning',40)}</span>${M('sad',130)}<h2 class="sora" style="font:700 20px 'Sora'">Piano non trovato</h2><button class="btn" data-to="/plans">${I('clipboard',18)}I tuoi piani</button></div>`};
 return {tab:'plans',cls:'pbd',html:'<div id="pv"></div>',mount:el=>{let edit=false,fresh=null;const pv=$('#pv',el);A.resume(p);
  const draw=()=>{const ci=curIdx(p);const done=p.stops.filter(s=>s.done).length;
   pv.innerHTML=`<div class="topbar"><button class="iconbtn" data-to="back" aria-label="Indietro">${I('back',24)}</button><h1 style="font-size:19px">${p.title}</h1><button class="iconbtn" data-act="copy" data-link="#/plan/${p.id}" aria-label="Condividi">${I('share',22)}</button><button class="iconbtn ${edit?'on':''}" id="ed" aria-label="Modifica" style="${edit?'background:var(--soft);color:var(--viola)':''}">${I('pencil',22)}</button></div>
   <div class="pad"><div class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px"><div class="row gap8" style="font:600 14px 'Sora'">${I('calendar',18,'var(--viola)')}${dLong(p.date)}</div><div class="row gap8" data-to="/invite/${p.id}" style="cursor:pointer">${I('users',18,'var(--viola)')}${avs(p,'s')}<span class="sm">${1+Object.values(p.friends).filter(x=>x!=='no').length} partecipanti</span><span class="grow"></span><span class="pill s lav">${I('plus',11)}Invita</span></div>
   <div class="row between"><span class="pill lime" style="font:600 12px 'Sora'">${I('trophy',14)}+${A.planXp(p)} XP se completi tutto</span><button class="pill s lav" data-to="/coord/${p.id}">${I('clipboard',11)}Coordina</button></div>${p.status!=='planned'?`<div><div class="row between xs" style="font-weight:600;margin-bottom:6px"><span>${done}/${p.stops.length} tappe</span><span>${Math.round(done/p.stops.length*100)}%</span></div><div class="bar"><i style="width:${done/p.stops.length*100}%"></i></div></div>`:''}</div></div>
   <div class="tl"><div class="line"></div>${p.stops.map((s,i)=>{const e=A.ev(s.ev),state=s.done?'done':i===ci?'cur':'fut';const prev=i?A.ev(p.stops[i-1].ev):null;
    return `${prev?`<div class="walk">${I('route',14)}${walkTxt(prev,e)}</div>`:''}<div class="stop ${state} ${fresh===i?'done-now':''} rv" data-i="${i}"><span class="tm">${s.time}</span><span class="nd ${state}">${state==='done'?I('check',8):''}</span><div class="cd" data-to="/event/${e.id}"><h3>${e.t}</h3><span class="meta">${I('pin',12)}${e.place}, ${A.fmtDist(e.km)}</span><span class="meta">${I('clock',12)}${e.dur}</span><div class="row gap8"><span class="pill s lav">${I(CATS[e.cat][1],10)}${CATS[e.cat][0]}</span><span class="pill s lime">+${A.xpOf(e)} XP</span></div>${state==='cur'?`<button class="btn sm block" data-act="done" data-i="${i}" style="margin-top:6px">${I('check',14)}Segna come completata</button>`:''}${edit?`<button class="rm" data-act="rmstop" data-i="${i}" aria-label="Rimuovi tappa">${I('x',14)}</button>`:''}</div></div>`}).join('')}</div>
   <div class="dock">${p.status==='planned'?`<button class="btn sec" style="flex:1;padding:12px 8px" id="ed2">${I('pencil',16)}Modifica tappe</button><button class="btn" style="flex:1;padding:12px 8px" data-act="start">${I('tri',14)}Inizia piano</button>`:p.status==='active'?`<button class="btn sec" style="flex:1;padding:12px 8px" id="ed2">${I('pencil',16)}Modifica tappe</button><button class="btn" style="flex:1;padding:12px 8px" data-act="done" data-i="${ci}">${I('check',16)}Completa tappa</button>`:`<button class="btn sec" style="flex:1;padding:12px 8px" data-act="repeat">${I('refresh',16)}Ripeti piano</button><button class="btn" style="flex:1;padding:12px 8px" data-to="/wizard">${I('plus',16)}Nuovo piano</button>`}</div>`;
   A.enhance(pv);if(pv.dataset.d)pv.querySelectorAll('.rv').forEach(x=>{x.style.transition='none';x.classList.add('in')});pv.dataset.d=1;pv.querySelector('#ed').onclick=()=>{edit=!edit;draw()};const e2=pv.querySelector('#ed2');if(e2)e2.onclick=()=>{edit=!edit;draw()};fresh=null};
  A.planAct={start:()=>{p.status='active';A.save();A.toast('Piano iniziato! Buon divertimento','tri');draw()},
   done:(el2)=>{const i=+el2.dataset.i;const s=p.stops[i];if(!s||s.done)return;s.done=true;const e=A.ev(s.ev);S.log.push({ev:e.id,cat:e.cat,night:s.time>='21:00',t:Date.now(),title:e.t});p.earned+=A.xpOf(e);A.award(A.xpOf(e),e.t);fresh=i;
    if(p.stops.every(x=>x.done)){p.status='done';p.earned+=50;A.save();draw();A.later(()=>{A.award(50,'Piano completato');A.confetti();A.modal(`<div class="col" style="align-items:center;text-align:center;gap:8px"><div class="lvring">${M('party',96)}</div><div class="sora" style="font:800 24px 'Sora'">Piano completato!</div><div class="muted">Hai guadagnato</div><div class="sora violet" style="font:800 32px 'Sora'">+<span data-count="${p.earned}" data-dur="1400">0</span> XP</div><div class="row gap8" style="width:100%;margin-top:8px"><button class="btn sec grow" data-close>Chiudi</button><button class="btn grow" data-close data-to="/badges">I tuoi badge</button></div></div>`,m=>A.enhance(m));A.checkBadges()},700)}
    else{A.save();draw();A.burstAt($('.stop.done-now .nd',pv)||pv,{n:12,r:70});A.checkBadges()}},
   rmstop:(el2)=>{const i=+el2.dataset.i;if(p.stops.length<=1)return A.toast('Serve almeno una tappa','warning');const row=$(`.stop[data-i="${i}"]`,pv);row.style.cssText='transition:all .3s;opacity:0;transform:translateX(40px)';setTimeout(()=>{p.stops.splice(i,1);A.save();draw()},280)},
   repeat:()=>{const np=A.createPlan({title:p.title,date:iso(A.dateOf(7)),slots:p.slots,cats:p.cats,friends:Object.keys(p.friends),stops:p.stops.map(s=>({ev:s.ev,time:s.time,done:false,votes:[]}))});A.toast('Piano duplicato','refresh');A.go('/plan/'+np.id)}};
  draw();A.planHook=pid=>{if(el.isConnected&&pid===p.id)draw()}}}});
Object.assign(A.act,{start:()=>A.planAct.start(),done:el=>A.planAct.done(el),rmstop:el=>A.planAct.rmstop(el),repeat:()=>A.planAct.repeat()});

/* ---------- inviti ---------- */
A.route('invite',([id])=>{const p=S.plans.find(x=>x.id===id);if(!p)return{html:'',mount:()=>A.replace('/plans')};
 const sugg=FRIENDS.slice(0,3),rest=FRIENDS;const btn=f=>{const st=p.friends[f.id];return st?`<button class="inv done" data-f="${f.id}">${I('check',14)}Invitato</button>`:`<button class="inv" data-f="${f.id}">Invita</button>`};const btn2=f=>{const st=p.friends[f.id];return st?`<button class="inv done" data-f="${f.id}">${I('check',14)}Invitato</button>`:`<button class="inv out" data-f="${f.id}">Invita</button>`};
 return {tab:'plans',html:`<div class="topbar"><button class="iconbtn" data-to="back" aria-label="Indietro">${I('back',24)}</button><h1>Invita amici</h1><span class="pill s lav" style="font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis">${p.title}</span></div>
 <div class="pad col gap16" style="padding-bottom:90px"><div class="card rv" style="padding:14px"><div class="row between"><div class="col gap4"><span class="row gap8" style="font:600 13px 'Sora'">${I('calendar',16,'var(--viola)')}${A.planDate(p)}</span><span class="sm muted" style="margin-left:24px">${p.stops.length} tappe</span></div><span class="row gap4" style="font:600 13px 'Sora'">${I('users',16,'var(--viola)')}<span id="pl">${1+Object.keys(p.friends).length}</span>/8 posti</span></div><div class="bar" style="height:4px;margin-top:12px"><i id="pbar" data-w="${(1+Object.keys(p.friends).length)/8*100}%"></i></div></div>
 <label class="input rv">${I('search',18)}<input id="fq" placeholder="Cerca per nome o username"></label>
 <div class="rv"><div class="sec">Suggeriti per te</div><div class="xs muted" style="margin:2px 0 10px">Basato sui tuoi gruppi</div><div class="col" style="gap:10px">${sugg.map(f=>`<div class="sg"><span class="ava l ${f.c}">${f.n[0]}</span><div class="grow"><b class="sora" style="font:600 15px 'Sora'">${f.n}</b><div class="sm muted">${f.together} piani insieme</div></div>${btn(f)}</div>`).join('')}</div></div>
 <div class="rv"><div class="sec" style="margin-bottom:6px">Dai tuoi contatti</div><div id="con">${rest.map(f=>`<div class="cr2" data-n="${f.n.toLowerCase()} ${f.u}"><span class="ava ${f.c}">${f.n[0]}</span><div class="grow"><b style="font-weight:600;font-size:14px">${f.n}</b><div class="xs muted">${f.u}</div></div>${btn2(f)}</div>`).join('')}</div></div>
 <div class="rv" style="background:var(--soft);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start">${I('link',32,'var(--viola)')}<b class="sora" style="font:600 15px 'Sora'">Condividi il link del piano</b><span class="sm muted">Chiunque con il link può unirsi</span><button class="btn sm" id="cp" style="margin-top:4px">${I('clipboard',16)}<span>Copia link</span></button><div class="row gap12" style="margin-top:8px"><span class="soc" data-act="copy" data-link="#/plan/${p.id}">${I('comment',20)}</span><span class="soc" data-act="copy" data-link="#/plan/${p.id}">${I('send',20)}</span><span class="soc" data-act="copy" data-link="#/plan/${p.id}">${I('camera',20)}</span><span class="soc" data-act="copy" data-link="#/plan/${p.id}">${I('dots',20)}</span></div></div></div>
 <div class="dock solid" style="align-items:center;justify-content:space-between"><span style="font-size:14px"><b id="ic">${Object.keys(p.friends).length}</b> persone invitate</span><button class="btn" style="padding:11px 22px" data-to="back">${I('check',16)}Fatto</button></div>`,
 mount:el=>{el.addEventListener('click',e=>{const b=e.target.closest('.inv');if(!b)return;const f=b.dataset.f;if(p.friends[f]){return}if(Object.keys(p.friends).length>=7)return A.toast('Posti esauriti','warning');p.friends[f]='wait';if(!S.invited.includes(f))S.invited.push(f);A.save();A.haptic();
   $$(`.inv[data-f="${f}"]`,el).forEach(x=>{x.className='inv done';x.innerHTML=I('check',14)+'Invitato'});$('#ic',el).textContent=Object.keys(p.friends).length;$('#pl',el).textContent=1+Object.keys(p.friends).length;$('#pbar',el).style.width=(1+Object.keys(p.friends).length)/8*100+'%';A.respond(p.id,f);A.checkBadges()});
  $('#cp',el).onclick=()=>{const b=$('#cp',el),o=b.innerHTML;try{navigator.clipboard.writeText(location.href)}catch(e){}b.style.background='var(--lime)';b.style.color='var(--ink)';b.innerHTML=I('check',16)+'<span>Copiato!</span>';A.later(()=>{b.innerHTML=o;b.style.background='';b.style.color=''},2000)};
  $('#fq',el).oninput=e=>{const v=e.target.value.toLowerCase();$$('#con .cr2',el).forEach(r=>r.style.display=r.dataset.n.includes(v)?'':'none')}}}});

/* ---------- coordinamento ---------- */
A.route('coord',([id])=>{const p=S.plans.find(x=>x.id===id);if(!p)return{html:'',mount:()=>A.replace('/plans')};
 return {tab:'plans',html:'<div id="cv"></div>',mount:el=>{const cv=$('#cv',el);A.resume(p);
  const draw=()=>{const fr=Object.keys(p.friends),yes=1+fr.filter(f=>p.friends[f]==='yes').length,tot=1+fr.length,pend=fr.some(f=>p.friends[f]==='wait');const part=Math.max(1,fr.filter(f=>p.friends[f]!=='no').length+1);
   const stt=s=>s==='yes'?['Confermato','#8aa31a','checkc']:s==='no'?['Non può','#E0558F','xc']:['In attesa','var(--warn)','clock'];
   const keep=$('#cl',cv)?$('#ni',cv).value:'';
   cv.innerHTML=`<div class="topbar"><button class="iconbtn" data-to="back" aria-label="Indietro">${I('back',24)}</button><h1 style="font-size:18px;white-space:nowrap">${p.title}</h1><span class="pill s lav" style="font-weight:600">${I('clipboard',12)}Coordinamento</span></div>
   <div class="pad col gap16" style="padding-bottom:90px"><div class="card" style="padding:16px 18px"><div class="sec" style="margin-bottom:6px">Chi viene?</div>
    <div class="pr"><span class="ava c-viola">${S.user.name[0]}</span><b class="grow" style="font:600 14px 'Sora'">${S.user.name}</b><span class="st" style="color:#8aa31a">${I('checkc',16)}Confermato</span></div>
    ${fr.length?fr.map(f=>{const [l,c,ic]=stt(p.friends[f]);return `<div class="pr"><span class="ava ${FR(f).c}">${FR(f).n[0]}</span><b class="grow" style="font:600 14px 'Sora'">${FR(f).n}</b><span class="st" style="color:${c}">${I(ic,16)}${l}</span></div>`}).join(''):`<div class="muted sm" style="padding:8px 0">Nessun amico invitato. <a class="violet" data-to="/invite/${p.id}" style="font-weight:600">Invita qualcuno</a></div>`}
    <div class="row between" style="margin-top:10px"><span class="sm" style="font-weight:600">${yes}/${tot} confermati</span><span class="xs muted">${Math.round(yes/tot*100)}%</span></div><div class="bar" style="margin-top:6px"><i style="width:${yes/tot*100}%"></i></div></div>
   <div><div class="sec">Vota le tappe</div><div class="sm muted" style="margin-top:2px">Scegli quelle che preferisci</div></div>
   <div class="col" style="gap:12px">${p.stops.map((s,i)=>{const e=A.ev(s.ev),v=s.votes.length,me=s.votes.includes('me'),pct=Math.min(100,v/part*100);return `<div class="vt"><div class="grow col gap6"><b class="sora" style="font:600 15px 'Sora'">${e.t}</b><div class="row gap12"><span class="meta">${I('pin',12)}${e.place}</span><span class="meta">${I('clock',12)}${s.time}</span></div><div class="row gap8"><div class="bar grow"><i class="${pct>=100?'full':''}" style="width:${pct}%"></i></div><span class="xs muted">${Math.min(v,part)}/${part}</span></div></div><button class="vb ${me?'on':''}" data-act="vote" data-i="${i}" aria-label="Vota">${I('thumb',18)}</button></div>`}).join('')}</div>
   <div style="background:var(--sunk);border-radius:16px;padding:16px"><div class="sec" style="font-size:14px;margin-bottom:12px">${I('comment',16)}Note del gruppo</div><div class="col gap12" id="cl">${p.notes.length?p.notes.map(n=>`<div class="nt"><span class="ava s ${n.f==='me'?'c-viola':FR(n.f).c}">${n.f==='me'?S.user.name[0]:FR(n.f).n[0]}</span><div><b style="font-size:14px">${n.f==='me'?S.user.name:FR(n.f).n}</b> <span class="xs muted">${n.t}</span><p>${n.m}</p></div></div>`).join(''):'<div class="muted sm">Nessuna nota. Scrivi la prima!</div>'}</div><div class="nb"><input id="ni" placeholder="Scrivi una nota..."><button data-act="note" aria-label="Invia">${I('send',16)}</button></div></div></div>
   <div class="dock solid"><button class="btn block tall ${pend||p.confirmed?'off':''}" data-act="confirm">${I('check',18)}${p.confirmed?'Piano confermato':'Conferma piano definitivo'}</button></div>`;
   A.enhance(cv);if(keep)$('#ni',cv).value=keep;const ni=$('#ni',cv);ni.onkeydown=e=>{if(e.key==='Enter')A.act.note()};cv.scrollIntoView&&0};
  const time=()=>new Date().toTimeString().slice(0,5);
  A.coordAct={vote:b=>{const s=p.stops[+b.dataset.i],i=s.votes.indexOf('me');i<0?s.votes.push('me'):s.votes.splice(i,1);A.save();A.haptic();draw()},
   note:()=>{const i=$('#ni',cv),v=i.value.trim();if(!v)return;p.notes.push({f:'me',t:time(),m:v.replace(/</g,'&lt;')});i.value='';A.save();draw();const fr=Object.keys(p.friends).filter(f=>p.friends[f]==='yes');if(fr.length&&p.notes.filter(n=>n.f!=='me').length<3){const f=fr[Math.floor(Math.random()*fr.length)],R=['Ottima idea!','Per me va benissimo.','Io ci sono, a dopo!','Possiamo anticipare un po\'?'];setTimeout(()=>{p.notes.push({f,t:time(),m:R[Math.floor(Math.random()*R.length)]});A.save();if(el.isConnected)draw()},1800)}},
   confirm:b=>{if(b.classList.contains('off'))return;p.confirmed=true;A.save();A.confetti();A.award(10,'Piano confermato');A.toast('Piano confermato!','check');draw()}};
  draw();A.planHook=pid=>{if(el.isConnected&&pid===p.id)draw()}}}});
Object.assign(A.act,{vote:b=>A.coordAct.vote(b),note:()=>A.coordAct.note(),confirm:b=>A.coordAct.confirm(b)});

/* ---------- gruppi ---------- */
A.route('groups',()=>{const ps=S.plans;return {tab:'groups',html:`<div style="padding:50px 24px 14px"><h1 style="font:700 24px 'Sora'">Gruppi</h1><div class="muted sm">I tuoi amici e le uscite condivise</div></div>
 <div class="section" style="margin-top:6px"><div class="sec rv">Uscite condivise</div>${ps.length?`<div class="col gap12">${ps.slice(0,4).map(p=>{const [l,c,ic]=planStatus(p);return `<a class="card plan rv" data-to="/plan/${p.id}"><span class="d">${I('calendar',14)}${A.planDate(p)}</span><h3>${p.title}</h3><div class="ft">${avs(p)}<span class="pill s ${c} grow" style="justify-content:center;margin-left:auto;max-width:110px">${I(ic,11)}${l}</span></div></a>`}).join('')}</div>`:`<div class="card rv" style="padding:24px;text-align:center"><div class="muted" style="margin-bottom:10px">Nessuna uscita ancora</div><button class="btn sm" data-to="/wizard">${I('plus',16)}Crea piano insieme</button></div>`}</div>
 <div class="section"><div class="sec rv">I tuoi amici</div><div class="col" style="gap:10px">${FRIENDS.map(f=>`<div class="sg rv"><span class="ava l ${f.c}">${f.n[0]}</span><div class="grow"><b class="sora" style="font:600 15px 'Sora'">${f.n}</b><div class="sm muted">${f.u} · Lv.${A.level(f.xp)}</div></div><span class="pill s lav">${f.xp} XP</span></div>`).join('')}</div></div>`}});

/* ---------- profilo ---------- */
const THEMES={auto:'Automatico',light:'Chiaro',dark:'Scuro'};
A.route('profile',()=>{const lv=A.lvProg(S.xp),done=S.plans.filter(p=>p.status==='done').length;const earned=BADGES.filter(b=>S.badges[b.id]);
 return {tab:'profile',html:`<div class="ph"><svg width="220" height="220"><circle cx="110" cy="110" r="75" fill="#A98BFF" opacity=".25"/></svg><div class="av">${S.user.name[0]}</div><div class="sora" style="font:700 22px 'Sora'">${S.user.name}</div><div style="font-size:14px;opacity:.8;display:flex;justify-content:center;align-items:center;gap:8px">@${S.user.name.toLowerCase().replace(/\s/g,'_')}_${(S.user.city||'torino').toLowerCase()}<i style="width:4px;height:4px;border-radius:50%;background:#fff;display:block"></i>Livello ${lv.lv}</div>
  <div class="stats"><div><b data-count="${S.xp}">0</b><span>XP</span></div><div><b data-count="${S.log.length}">0</b><span>Tappe</span></div><div><b data-count="${earned.length}">0</b><span>Badge</span></div></div>
  <div class="lvb"><div class="row between" style="font-size:13px"><span>${A.lvTitle(lv.lv)}</span><span>${lv.cur} / ${lv.need} XP</span></div><div class="tk"><i data-w="${lv.pct}%"></i></div></div></div>
 <div class="section"><div class="sec big rv row between" style="margin-bottom:14px"><span class="row gap8">${I('trophy',18,'var(--viola)')}I tuoi Badge</span><a class="sm violet" data-to="/badges" style="font:500 13px 'Sora'">Tutti</a></div></div>
 <div class="hscroll rv" style="gap:14px;padding:2px 24px">${BADGES.map(b=>`<div class="bg1 ${S.badges[b.id]?'':'lock'}" data-to="/badges"><span class="b" style="background:var(--${b.col});${b.col==='viola'||b.col==='prugna'?'color:#fff':''}">${I(S.badges[b.id]?b.ic:'lock',26)}</span>${b.n}</div>`).join('')}</div>
 <div class="section"><div class="sec rv">I tuoi interessi</div><div class="wrap rv">${S.interests.map(c=>`<span class="pill lav">${I(CATS[c][1],14)}${CATS[c][0]}</span>`).join('')}<button class="pill" data-act="interests" style="outline:1.5px dashed var(--g300);outline-offset:-1.5px;color:var(--fg2)">${I('plus',14)}Modifica</button></div></div>
 <div class="section"><div class="sec rv">Attività recenti</div><div class="col" style="gap:10px">${S.log.length?S.log.slice(-3).reverse().map(l=>`<div class="card rv" style="display:flex;align-items:center;gap:12px;padding:12px 14px"><span class="ava c-lav" style="border-radius:12px">${I(CATS[l.cat][1],18,'var(--viola)')}</span><div class="grow"><b class="sora" style="font:600 14px 'Sora'">${l.title}</b><div class="xs muted">${A.timeAgo(l.t)}</div></div><b class="violet" style="font-size:13px">+${CATXP[l.cat]} XP</b></div>`).join(''):`<div class="card rv muted sm" style="padding:16px;text-align:center">Completa una tappa di un piano per vedere qui la tua attività.</div>`}</div></div>
 <div class="section"><div class="sec rv">Statistiche</div><div class="card rv" style="padding:12px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="cell">${I('flame',22,'var(--viola)')}<b data-count="${S.streak}" data-dur="700">0</b><span class="xs muted">Giorni di streak</span></div><div class="cell">${I('pin',22,'var(--viola)')}<b data-count="${S.mapSeen.length}" data-dur="700">0</b><span class="xs muted">Luoghi scoperti</span></div><div class="cell">${I('users',22,'var(--viola)')}<b data-count="${S.invited.length}" data-dur="700">0</b><span class="xs muted">Amici invitati</span></div><div class="cell">${I('clipboard',22,'var(--viola)')}<b data-count="${S.plans.length}" data-dur="700">0</b><span class="xs muted">Piani creati</span></div></div></div></div>
 <div class="section rv"><button class="set" data-act="editprofile">${I('pencil',20,'var(--viola)')}<span class="grow">Modifica profilo</span>${I('right',16,'var(--fg2)')}</button><button class="set" data-act="notifprefs">${I('bell',20,'var(--viola)')}<span class="grow">Notifiche</span><span class="xs muted">${S.notify?'Attive':'Disattivate'}</span>${I('right',16,'var(--fg2)')}</button><button class="set" data-act="editprofile">${I('pin',20,'var(--viola)')}<span class="grow">La tua città: ${S.user.city||'Torino'}</span>${I('right',16,'var(--fg2)')}</button><button class="set" data-act="theme">${I('theme',20,'var(--viola)')}<span class="grow">Tema: <b id="tn">${THEMES[S.theme]}</b></span>${I('right',16,'var(--fg2)')}</button><button class="set" data-act="help">${I('help',20,'var(--viola)')}<span class="grow">Aiuto e supporto</span>${I('right',16,'var(--fg2)')}</button><button class="set" data-act="logout" style="border:0;color:#E0558F">${I('door',20)}<span class="grow">Esci</span>${I('right',16)}</button></div>`}});
Object.assign(A.act,{
 theme:el=>{const o=['auto','light','dark'];S.theme=o[(o.indexOf(S.theme)+1)%3];A.save();A.applyTheme();$('#tn').textContent=THEMES[S.theme];A.toast('Tema: '+THEMES[S.theme],'theme')},
 interests:()=>A.sheet(`<h3 class="sora" style="font:700 20px 'Sora';margin:4px 0 4px">I tuoi interessi</h3><div class="muted sm">Personalizzano «Per te» e i nuovi piani</div><div class="grid3" id="gr">${Object.entries(CATS).map(([k,v])=>`<span class="gi ${S.interests.includes(k)?'on':''}" data-c="${k}">${I(v[1],24)}${v[0]}</span>`).join('')}</div><button class="btn block tall" data-close style="margin-top:18px">Fatto</button>`,sh=>{$('#gr',sh).onclick=e=>{const c=e.target.closest('.gi');if(!c)return;const k=c.dataset.c,i=S.interests.indexOf(k);i<0?S.interests.push(k):S.interests.splice(i,1);c.classList.toggle('on');A.save()}},{onClose:()=>A.render()}),
 editprofile:()=>A.sheet(`<h3 class="sora" style="font:700 20px 'Sora';margin:4px 0 14px">Modifica profilo</h3><div class="col" style="gap:12px"><label class="input">${I('user',18)}<input id="en" value="${S.user.name}" placeholder="Nome"></label><label class="input">${I('pin',18)}<input id="ec" value="${S.user.city||'Torino'}" placeholder="Città"></label></div><button class="btn block tall" id="sv" style="margin-top:18px">Salva</button>`,(sh,close)=>{$('#sv',sh).onclick=()=>{const n=$('#en',sh).value.trim();if(!n)return A.toast('Inserisci un nome','warning');S.user.name=n;S.user.city=$('#ec',sh).value.trim()||'Torino';A.save();close();A.toast('Profilo aggiornato','check');setTimeout(A.render,320)}}),
 notifprefs:()=>A.sheet(`<h3 class="sora" style="font:700 20px 'Sora';margin:4px 0 14px">Notifiche</h3><div class="ct ${S.notify?'on':''}" id="tg"><div class="grow"><b style="font-weight:600">Avvisi su piani e amici</b><div class="sm muted">Conferme, inviti e badge</div></div><span class="ck">${I('check',14)}</span></div><button class="btn block tall" data-close style="margin-top:18px">Chiudi</button>`,sh=>{$('#tg',sh).onclick=e=>{S.notify=!S.notify;$('#tg',sh).classList.toggle('on',S.notify);A.save()}},{onClose:()=>A.render()}),
 help:()=>A.sheet(`<h3 class="sora" style="font:700 20px 'Sora';margin:4px 0 12px">Aiuto e supporto</h3><div class="row gap12" style="align-items:flex-end">${M('wave',70)}<span class="bubble" style="margin-bottom:26px">Come posso aiutarti?</span></div><div class="col" style="gap:10px;margin-top:10px"><div class="sg">${I('star',20,'var(--viola)')}<span class="grow sm">Ogni tappa completata ti dà XP, completare un piano un bonus.</span></div><div class="sg">${I('users',20,'var(--viola)')}<span class="grow sm">Invita gli amici dal piano: confermeranno e voteranno le tappe.</span></div></div><button class="btn sec block" style="margin-top:14px" data-act="resetall">${I('refresh',18)}Ricomincia da zero</button>`),
 resetall:()=>A.modal(`<div class="center col" style="align-items:center;gap:10px;text-align:center">${M('sad',90)}<div class="sora" style="font:700 20px 'Sora'">Cancellare tutto?</div><div class="muted sm">Piani, XP e badge verranno rimossi da questo dispositivo.</div><div class="row gap8" style="width:100%;margin-top:6px"><button class="btn sec grow" data-close>Annulla</button><button class="btn grow" id="yes" style="background:#E0558F">Cancella</button></div></div>`,m=>{$('#yes',m).onclick=()=>A.reset()}),
 logout:()=>A.modal(`<div class="center col" style="align-items:center;gap:10px;text-align:center">${M('wave',90)}<div class="sora" style="font:700 20px 'Sora'">Vuoi uscire?</div><div class="muted sm">Ti aspettiamo presto in città.</div><div class="row gap8" style="width:100%;margin-top:6px"><button class="btn sec grow" data-close>Resta</button><button class="btn grow" id="yes">Esci</button></div></div>`,m=>{$('#yes',m).onclick=()=>{S.user=null;A.save();A.replace('/auth')}})});

/* ---------- badge ---------- */
A.route('badges',()=>{const lv=A.lvProg(S.xp);const earned=BADGES.filter(b=>S.badges[b.id]),locked=BADGES.filter(b=>!S.badges[b.id]).map(b=>({b,p:Math.min(1,b.get(S)/b.goal)})).sort((x,y)=>y.p-x.p);
 const board=[...FRIENDS.map(f=>({n:f.n,xp:f.xp,c:f.c})),{n:S.user.name+' (tu)',xp:S.xp,c:'c-viola',me:1}].sort((a,b)=>b.xp-a.xp);
 return {tab:'profile',html:`<div class="topbar"><button class="iconbtn" data-to="back" aria-label="Indietro">${I('back',24)}</button><h1>Badge e Progressi</h1>${I('trophy',20,'var(--viola)')}</div>
 <div class="pad col gap16"><div class="hl rv"><svg width="200" height="200"><circle cx="100" cy="100" r="70" fill="#A98BFF" opacity=".2"/></svg><div class="row between" style="align-items:flex-start"><div><div class="sora" style="font:800 32px 'Sora'">Livello ${lv.lv}</div><div style="font-size:16px;opacity:.8">${A.lvTitle(lv.lv)}</div></div><span class="float">${M('party',72)}</span></div><div class="tk"><i data-w="${lv.pct}%"></i></div><div style="font-size:13px">${lv.cur} / ${lv.need} XP per il Livello ${lv.lv+1}</div><div class="row gap6" style="font-size:14px;color:var(--lime);margin-top:6px">${I('bolt',16)}Mancano ${lv.need-lv.cur} XP</div></div>
 <div class="row between rv" style="margin-top:6px"><span class="sec big">Badge sbloccati</span><span class="sm muted">${earned.length} su ${BADGES.length}</span></div>
 <div class="bgs">${BADGES.map(b=>{const on=S.badges[b.id],pr=Math.min(1,b.get(S)/b.goal);return `<div class="bgi rv ${on?'':'lock'}"><span class="c" style="background:var(--${b.col});${b.col==='viola'||b.col==='prugna'?'color:#fff':''}">${I(on?b.ic:b.ic,28)}${on?'':`<svg width="64" height="64" viewBox="0 0 64 64" style="position:absolute;inset:0;transform:rotate(-90deg)"><circle cx="32" cy="32" r="30" fill="none" stroke="var(--viola)" stroke-width="3" stroke-dasharray="${188*pr} 188" stroke-linecap="round"/></svg>`}</span><b>${b.n}</b><small>${on?new Date(on).getDate()+' '+A.MON[new Date(on).getMonth()].slice(0,3):b.get(S)+'/'+b.goal}</small></div>`}).join('')}</div>
 ${locked.length?`<div class="sec big rv" style="margin-top:8px">${I('target',20,'var(--viola)')}Prossimi obiettivi</div><div class="col" style="gap:12px">${locked.slice(0,4).map(({b,p})=>`<div class="ob rv"><span class="ci" style="opacity:.6">${I(b.ic,22)}</span><div class="grow col gap4"><b class="sora" style="font:600 14px 'Sora'">${b.n}</b><span class="sm muted">${b.d}</span><div class="bar"><i data-w="${p*100}%"></i></div></div><span class="xs muted">${b.get(S)}/${b.goal}</span></div>`).join('')}</div>`:''}
 <div class="sec rv" style="margin-top:8px">${I('users',18,'var(--viola)')}Tra i tuoi amici</div><div class="col gap4">${board.map((u,i)=>`<div class="lb rv" style="${u.me?'background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--viola)':i===0?'background:rgba(217,239,112,.18)':''}"><span class="n">${i+1}</span><span class="ava m ${u.c}">${u.n[0]}</span><b class="grow" style="font:600 14px 'Sora'">${u.n}</b><span class="sm">${u.xp} XP</span><span class="pill s ${i===0?'lime':u.me?'viola':'lav'}">Lv.${A.level(u.xp)}</span></div>`).join('')}</div>
 <div class="row gap8 rv" style="align-items:flex-end;margin-top:6px">${M('wave',64)}<span class="bubble" style="margin-bottom:24px;--d:.2s">${locked.length?'Continua così, manca poco al prossimo badge!':'Hai sbloccato tutto, sei una leggenda!'}</span></div></div>`}});
})();
</script>
<script>A.boot()</script>
