<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIVI — Accedi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vivi.css"><script src="vivi.js"></script>
<style>
.fld{position:relative}
.fld .input{height:54px}
.fld label{position:absolute;left:44px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--fg2);pointer-events:none;transition:all .2s var(--ease);background:transparent}
.fld input:focus+label,.fld input:not(:placeholder-shown)+label{top:0;font-size:11px;font-weight:600;color:var(--viola);background:var(--bg);padding:0 6px;left:38px}
.fld input::placeholder{color:transparent}
.hdr{padding-top:56px;text-align:center}
.seg{position:relative;display:flex;background:var(--sunk);border-radius:14px;padding:3px}
.seg i{position:absolute;top:3px;left:3px;width:calc(50% - 3px);height:calc(100% - 6px);background:var(--card-bg);border-radius:11px;box-shadow:0 1px 4px rgba(0,0,0,.08);transition:transform .3s var(--ease)}
.seg button{position:relative;flex:1;padding:11px;font:600 14px 'DM Sans';color:var(--fg2);transition:color .2s}.seg button.on{color:var(--fg)}
.form{display:none;flex-direction:column;gap:14px;animation:xf .3s ease both}.form.on{display:flex}
@keyframes xf{from{opacity:0}to{opacity:1}}
.sep{display:flex;align-items:center;gap:12px;color:var(--fg2);font-size:13px}.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--g300)}
.soc{display:flex;align-items:center;justify-content:center;gap:10px;height:50px;border-radius:14px;font:500 14px 'DM Sans';transition:transform .2s,box-shadow .2s;width:100%}
.soc:hover{transform:translateY(-1px);box-shadow:0 6px 16px var(--card-shadow)}
</style></head><body>
<div class="phone"><div class="screen nopad" style="padding-bottom:30px">
<div class="hdr"><div class="sora" style="font:800 36px 'Sora';color:var(--soft-fg)">VIVI</div>
 <div class="row center" style="gap:2px;margin-top:6px;align-items:flex-end"><span data-m="wave" data-s="72"></span><span class="bubble" style="--d:.5s;margin-bottom:34px">Ehi! Che si fa oggi?</span></div></div>
<div class="pad col gap16" style="margin-top:6px">
 <div class="seg" id="seg"><i id="sl"></i><button class="on" data-f="login">Accedi</button><button data-f="reg">Registrati</button></div>
 <form class="form on" id="login" onsubmit="return false">
  <div class="fld"><div class="input"><i data-i="mail" data-s="18"></i><input id="e1" type="email" placeholder="La tua email"><label for="e1">La tua email</label></div></div>
  <div class="fld"><div class="input"><i data-i="lock" data-s="18"></i><input id="p1" type="password" placeholder="Password"><label for="p1">Password</label><button type="button" data-eye="#p1" aria-label="Mostra password"><i data-i="eye" data-s="18"></i></button></div></div>
  <a href="#" class="sm violet" style="align-self:flex-end;font-weight:500">Password dimenticata?</a>
  <button class="btn block tall">Accedi <i data-i="arrow" data-s="18"></i></button>
 </form>
 <form class="form" id="reg" onsubmit="return false">
  <div class="fld"><div class="input"><i data-i="user" data-s="18"></i><input id="n2" placeholder="Come ti chiami?"><label for="n2">Come ti chiami?</label></div></div>
  <div class="fld"><div class="input"><i data-i="mail" data-s="18"></i><input id="e2" type="email" placeholder="La tua email"><label for="e2">La tua email</label></div></div>
  <div class="fld"><div class="input"><i data-i="lock" data-s="18"></i><input id="p2" type="password" placeholder="Scegli una password"><label for="p2">Scegli una password</label><button type="button" data-eye="#p2" aria-label="Mostra password"><i data-i="eye" data-s="18"></i></button></div></div>
  <div class="fld"><div class="input"><i data-i="pin" data-s="18"></i><input id="c2" placeholder="In che città sei?"><label for="c2">In che città sei?</label></div></div>
  <button class="btn block tall">Crea account <i data-i="check" data-s="18"></i></button>
 </form>
 <div class="sep">oppure</div>
 <button class="soc" style="background:var(--card-bg);border:1.5px solid var(--g300)"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.500 12.250c0-.8-.07-1.570-.2-2.300H12v4.350h5.900a5.050 5.050 0 01-2.190 3.310v2.750h3.540c2.070-1.910 3.250-4.720 3.250-8.110z"/><path fill="#34A853" d="M12 23c2.970 0 5.460-.98 7.280-2.660l-3.540-2.750c-.98.660-2.230 1.060-3.740 1.060-2.870 0-5.300-1.940-6.170-4.550H2.170v2.840A11 11 0 0012 23z"/><path fill="#FBBC05" d="M5.830 14.100a6.600 6.600 0 010-4.200V7.060H2.170a11 11 0 000 9.880z"/><path fill="#EA4335" d="M12 5.350c1.620 0 3.060.56 4.210 1.640l3.150-3.150C17.450 2.090 14.970 1 12 1A11 11 0 002.170 7.060l3.660 2.840C6.700 7.290 9.130 5.350 12 5.350z"/></svg>Continua con Google</button>
 <button class="soc" style="background:var(--prugna);color:#fff"><svg width="18" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M16.400 12.600c0-2.400 2-3.500 2.100-3.600-1.200-1.700-3-1.900-3.600-1.900-1.500-.2-3 .9-3.800.9s-2-.9-3.300-.9C6 7.100 4.400 8.100 3.600 9.600c-1.800 3.100-.5 7.700 1.300 10.200.9 1.200 1.900 2.600 3.300 2.500 1.300-.1 1.800-.8 3.400-.8s2 .8 3.400.8 2.300-1.200 3.100-2.500c1-1.400 1.400-2.800 1.400-2.900-.1 0-2.700-1-2.700-4.300zM14 5.200c.7-.9 1.200-2.100 1-3.300-1 0-2.300.7-3 1.600-.7.8-1.200 2-1.100 3.200 1.100.1 2.300-.6 3.100-1.500z"/></svg>Continua con Apple</button>
 <p class="xs muted center" style="margin-top:4px">Continuando accetti i Termini e la Privacy Policy</p>
</div></div></div>
<script>
const seg=document.getElementById('seg');seg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
 document.getElementById('sl').style.transform=b.dataset.f==='reg'?'translateX(100%)':'none';
 document.querySelectorAll('.form').forEach(f=>f.classList.toggle('on',f.id===b.dataset.f));});
</script></body></html>
